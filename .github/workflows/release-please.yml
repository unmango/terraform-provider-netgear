name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: unmango/actions/.github/workflows/release-please.yml@56abf92ca6c8e241831118a76b7b2ce1d3b8d414 # v1.1.1
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
